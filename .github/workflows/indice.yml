name: Índice de búsqueda
on:
  schedule:
    - cron: '17 3 * * 1'   # lunes 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency: indice
jobs:
  indice:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/build_index.py
      - name: Guardar índice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add search/index.json search/cache.json
          git diff --cached --quiet || git commit -m "Actualizar índice de búsqueda"
          git push
